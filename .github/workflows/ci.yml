name: Tests (offline, read-only)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RoadImpact as Python package
        run: python -m pip install -e '.[test]'
      - name: Run original evidence protocol tests
        run: python -m unittest discover -s research/evidence -p 'test_*.py' -v
      - name: Run package source regressions
        run: python -m pytest -q research/offline/test_core.py
      - name: Confirm installed command-line tools
        run: |
          roadimpact --help > /dev/null
          roadimpact-review --help > /dev/null
          roadimpact-evidence --help > /dev/null
          roadimpact-benchmark --help > /dev/null
